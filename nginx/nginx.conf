# =============================================================================
#  Nginx -- box5g.topnet.tn
#  Architecture :
#    - Frontend  (Express/EJS) -> http://site:3000
#    - Admin UI  (Next.js)     -> http://admin:3001
#    - Backend   (Django DRF)  -> http://backend:8000
#  Certificats SSL montés via docker-compose : ./nginx/certs/
# =============================================================================

# ---------- upstreams --------------------------------------------------------
upstream frontend {
    server site:3000;
    keepalive 64;
}

upstream backend_up {
    server backend:8000;
    keepalive 64;
}

upstream admin_up {
    server admin:3001;
    keepalive 64;
}

# ---------- HTTP -> HTTPS redirect -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name box5g.topnet.tn;

    # ACME challenge (si besoin certbot plus tard)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS -- site principal ------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name box5g.topnet.tn;

    # -------------------------------------------------------------------------
    #  Certificats SSL
    # -------------------------------------------------------------------------
    ssl_certificate      /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key  /etc/nginx/certs/topnet.tn.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_tickets       off;

    # HSTS -- 6 mois
    add_header Strict-Transport-Security "max-age=15768000" always;

    # Headers de sécurité
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header X-XSS-Protection         "1; mode=block"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # Logs
    access_log /var/log/nginx/box5g.topnet.tn.access.log combined;
    error_log  /var/log/nginx/box5g.topnet.tn.error.log  warn;

    # =========================================================================
    #  Next.js Admin UI  ->  /admin
    # =========================================================================
    location /admin {
        proxy_pass         http://admin_up;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_cache_bypass    $http_upgrade;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
    }

    # Next.js static assets (_next)
    location /_next/ {
        proxy_pass         http://admin_up;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # =========================================================================
    #  Django Native Admin  ->  /django-admin/
    # =========================================================================
    location /django-admin/ {
        proxy_pass         http://backend_up;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
    }

    # =========================================================================
    #  Django API -> /api/
    # =========================================================================
    location /api/ {
        proxy_pass         http://backend_up;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_cache_bypass    $http_upgrade;
        client_max_body_size  50m;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
    }

    # Fichiers médias Django (uploads, images)
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        access_log off;
    }

    # Fichiers statiques Django Admin
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # =========================================================================
    #  Assets statiques Frontend (hors /admin, /media/, /static/, /django-admin)
    # =========================================================================
    location ~ ^/(?!admin|media|_next|static|django-admin).*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp)$ {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        expires    30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # =========================================================================
    #  Frontend Express -- site public (FR: /  |  AR: /ar)
    # =========================================================================
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_cache_bypass    $http_upgrade;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # Compression gzip
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/rss+xml
                    application/atom+xml image/svg+xml;
}
