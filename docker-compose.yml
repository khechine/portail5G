# =============================================================================
#  Docker Compose -- Portail 5G Topnet
#  Services :
#    db       -> PostgreSQL 16          (port interne 5432)
#    backend  -> Django DRF / Gunicorn  (port interne 8000)
#    site     -> Frontend Express/EJS   (port interne 3000)
#    admin    -> Next.js Admin UI       (port interne 3001)
#    nginx    -> Reverse proxy          (ports publics 80 / 443)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  #  PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: portail5g_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: portail5g
      POSTGRES_USER: portail5g
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Topnet2026!}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portail5g"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  #  Django Backend (DRF + Gunicorn)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portail5g_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://portail5g:${DB_PASSWORD:-Topnet2026!}@db:5432/portail5g
    volumes:
      - django_media:/app/media
      - django_static:/app/staticfiles
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s = socket.socket(); s.connect(('localhost', 8000)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  #  Frontend site (Express/EJS) -- FR & AR
  # ---------------------------------------------------------------------------
  site:
    build:
      context: ./site
      dockerfile: Dockerfile
    container_name: portail5g_site
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Remplace STRAPI_URL -- pointe maintenant vers Django
      STRAPI_URL: http://backend:8000
      STRAPI_PUBLIC_URL: ""
    volumes:
      - ./site:/app
    networks:
      - internal
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  #  Admin UI (Next.js)
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    container_name: portail5g_admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: /api
    networks:
      - internal
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ---------------------------------------------------------------------------
  #  Nginx -- reverse proxy + SSL
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: portail5g_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/box5g.conf:ro
      - ./nginx/ssl:/etc/nginx/certs:ro
      - django_static:/var/www/static:ro
      - django_media:/var/www/media:ro
    networks:
      - internal
    depends_on:
      - backend
      - site
      - admin

# -----------------------------------------------------------------------------
#  Volumes
# -----------------------------------------------------------------------------
volumes:
  pg_data:
    driver: local
  django_media:
    driver: local
  django_static:
    driver: local

# -----------------------------------------------------------------------------
#  Reseaux
# -----------------------------------------------------------------------------
networks:
  internal:
    driver: bridge
